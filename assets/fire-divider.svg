<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="44" viewBox="0 0 1000 44">
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5a0000" stop-opacity="0"/><stop offset=".18" stop-color="#ff2400"/><stop offset=".5" stop-color="#ffd34d"/><stop offset=".82" stop-color="#ff3b00"/><stop offset="1" stop-color="#5a0000" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="20" width="1000" height="3" rx="1.5" fill="url(#heat)" filter="url(#glow)">
    <animate attributeName="opacity" values=".55;1;.65;1;.55" dur="2s" repeatCount="indefinite"/>
  </rect>
  <g fill="#ffd34d" filter="url(#glow)">
    <circle cx="120" cy="20" r="2"><animate attributeName="cx" values="120;170;120" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="19" r="1.6"><animate attributeName="cy" values="19;9;19" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="21" r="2.3"><animate attributeName="r" values="1;3;1" dur=".8s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="19" r="1.8"><animate attributeName="cx" values="710;760;710" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="20" r="2"><animate attributeName="cy" values="20;11;20" dur="1s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#ff6a00" stroke-width="2" stroke-linecap="round" filter="url(#glow)">
    <path d="M210 9 l20 -5"><animate attributeName="opacity" values=".1;1;.1" dur=".7s" repeatCount="indefinite"/></path>
    <path d="M390 32 l24 5"><animate attributeName="opacity" values="1;.15;1" dur="1s" repeatCount="indefinite"/></path>
    <path d="M620 7 l17 -4"><animate attributeName="opacity" values=".2;1;.2" dur=".9s" repeatCount="indefinite"/></path>
    <path d="M790 31 l22 5"><animate attributeName="opacity" values="1;.2;1" dur=".8s" repeatCount="indefinite"/></path>
  </g>
</svg>